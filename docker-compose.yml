services:
  api:
    image: ghcr.io/henzmiguel/weatherreport:latest
    command: npm run start
    environment:
      PORT: 3000
      DATA_DIR: /app/backend/data
      AUTH_SECRET: weatherreport-docker-secret
      RADAR_BASE_URL: https://radarmeteorologico.com.br
      OPEN_METEO_BASE_URL: https://api.open-meteo.com
      NOMINATIM_BASE_URL: https://nominatim.openstreetmap.org
    ports:
      - "3000:3000"
    volumes:
      - weather-data:/app/backend/data
    restart: unless-stopped

  frontend:
    image: ghcr.io/henzmiguel/weatherreport:latest
    command: npx vite frontend --host 0.0.0.0
    environment:
      API_PROXY_TARGET: http://api:3000
    depends_on:
      - api
    ports:
      - "5173:5173"
    restart: unless-stopped

volumes:
  weather-data:
